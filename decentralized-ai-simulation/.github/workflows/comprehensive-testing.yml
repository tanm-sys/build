name: Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: true
        default: 'all'
        type: choice
        options:
          - unit
          - integration
          - e2e
          - performance
          - security
          - all

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  TEST_TIMEOUT: 1800  # 30 minutes
  COVERAGE_THRESHOLD: 95

jobs:
  # Static Analysis and Code Quality
  static-analysis:
    name: Static Analysis & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install black flake8 mypy isort bandit safety
        pip install -r requirements.txt
    
    - name: Code formatting (Black)
      run: |
        black --check --diff src/ tests/
    
    - name: Import sorting (isort)
      run: |
        isort --check-only --diff src/ tests/
    
    - name: Linting (flake8)
      run: |
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503
    
    - name: Type checking (mypy)
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional
    
    - name: Security scanning (bandit)
      run: |
        bandit -r src/ -f json -o bandit-report.json
        bandit -r src/ || true
    
    - name: Dependency vulnerability scanning
      run: |
        safety check --json --output safety-report.json
        safety check || true
    
    - name: Upload static analysis results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: static-analysis-reports
        path: |
          bandit-report.json
          safety-report.json

  # Unit Testing
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-mock coverage[toml]
        pip install numpy pandas scikit-learn tensorflow xgboost cryptography
        pip install -r requirements.txt
    
    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=95 \
          -n auto \
          --maxfail=5 \
          --timeout=300 \
          -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unit-tests
        name: codecov-unit-${{ matrix.python-version }}
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports-unit-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/

  # Integration Testing
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-cov psycopg2-binary
        pip install -r requirements.txt
    
    - name: Wait for services
      run: |
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 1; done'
        timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379
      run: |
        pytest tests/integration/ \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=90 \
          -n auto \
          --maxfail=3 \
          --timeout=600 \
          -v \
          -m "not slow"
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          coverage.xml
          htmlcov/

  # End-to-End Testing
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pytest pytest-asyncio selenium
        pip install -r requirements.txt
    
    - name: Install Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Install ChromeDriver
      run: |
        CHROMEDRIVER_VERSION=`curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE`
        curl -sS -o /tmp/chromedriver_linux64.zip http://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
        sudo unzip -o /tmp/chromedriver_linux64.zip -d /usr/local/bin
        sudo chmod +x /usr/local/bin/chromedriver
    
    - name: Start test services
      run: |
        # Start mock services for E2E testing
        python scripts/testing/start_mock_services.py &
        sleep 10
    
    - name: Run E2E tests
      env:
        E2E_TEST_MODE: true
        SELENIUM_HEADLESS: true
      run: |
        pytest tests/e2e/ \
          --cov=src/ \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=85 \
          -n 2 \
          --maxfail=2 \
          --timeout=1800 \
          -v \
          -m "e2e and not slow"
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          coverage.xml
          htmlcov/
          screenshots/
          videos/

  # Performance Testing
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pytest pytest-benchmark memory-profiler psutil locust
        pip install -r requirements.txt
    
    - name: Run performance tests
      env:
        PERFORMANCE_TEST_MODE: true
      run: |
        pytest tests/performance/ \
          --benchmark-only \
          --benchmark-sort=mean \
          --benchmark-json=benchmark-results.json \
          --timeout=1800 \
          -v
    
    - name: Generate performance report
      run: |
        python scripts/testing/generate_performance_report.py
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: |
          benchmark-results.json
          performance-report.html

  # Security Testing
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pytest pytest-security bandit safety semgrep
        pip install -r requirements.txt
    
    - name: Run security tests
      run: |
        pytest tests/security/ \
          --cov=src/ \
          --cov-report=xml \
          -v \
          -m "security"
    
    - name: Advanced security scanning
      run: |
        # Semgrep scanning
        semgrep --config=auto --json --output=semgrep-report.json src/ || true
        
        # Bandit security analysis
        bandit -r src/ -f json -o bandit-advanced-report.json || true
        
        # Safety dependency check
        safety check --json --output=safety-advanced-report.json || true
    
    - name: Upload security test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          coverage.xml
          semgrep-report.json
          bandit-advanced-report.json
          safety-advanced-report.json

  # Load Testing
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install locust aiohttp asyncio
        pip install -r requirements.txt
    
    - name: Start application for load testing
      run: |
        # Start application in background
        python -m src.api.api_server &
        sleep 30
    
    - name: Run load tests
      run: |
        locust -f tests/load/locustfile.py \
          --host=http://localhost:8080 \
          --headless \
          --users=1000 \
          --spawn-rate=10 \
          --run-time=300s \
          --csv=load-test-results \
          --html=load-test-report.html
    
    - name: Upload load test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: load-test-results
        path: |
          load-test-results_*
          load-test-report.html

  # Test Summary and Quality Gates
  test-summary:
    name: Test Summary & Quality Gates
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, performance-tests, security-tests]
    if: always()
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install analysis dependencies
      run: |
        pip install --upgrade pip
        pip install coverage pytest-html jinja2 markdown
    
    - name: Generate comprehensive test report
      run: |
        python scripts/testing/generate_comprehensive_test_report.py
    
    - name: Check quality gates
      run: |
        python scripts/testing/check_quality_gates.py
    
    - name: Upload comprehensive report
      uses: actions/upload-artifact@v3
      with:
        name: comprehensive-test-report
        path: |
          comprehensive-test-report.html
          test-summary.md
          quality-gate-results.json
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('test-summary.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });

  # Deployment Tests
  deployment-tests:
    name: Deployment Tests
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t decentralized-ai-simulation:test .
    
    - name: Run deployment tests
      run: |
        # Test container startup
        docker run --rm -d --name test-container -p 8080:8080 decentralized-ai-simulation:test
        sleep 30
        
        # Test API health
        curl -f http://localhost:8080/health || exit 1
        
        # Test basic functionality
        python scripts/testing/test_deployment.py
        
        # Cleanup
        docker stop test-container
    
    - name: Upload deployment test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: deployment-test-results
        path: deployment-test-log.txt

  # Notification
  notify-results:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: always()
    
    steps:
    - name: Notify Slack on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: 'Testing pipeline failed for ${{ github.repository }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
    
    - name: Notify Slack on success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: 'Testing pipeline completed successfully for ${{ github.repository }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}