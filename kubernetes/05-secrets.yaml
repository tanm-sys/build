# Secrets for AI Simulation Platform
apiVersion: v1
kind: Secret
metadata:
  name: ai-simulation-secrets
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: security
type: Opaque
stringData:
  # Database credentials
  database-url: "postgresql://user:password@ai-simulation-postgresql:5432/ai_simulation"
  postgresql-user: "postgres"
  postgresql-password: "secure-postgres-password-123"
  
  # Redis credentials
  redis-url: "redis://redis-password@ai-simulation-redis:6379"
  
  # Security keys
  jwt-secret: "your-super-secret-jwt-key-change-in-production"
  encryption-key: "your-32-character-encryption-key"
  
  # External API keys (example)
  slack-webhook: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  
  # SSL certificates (for production)
  tls-cert: |
    -----BEGIN CERTIFICATE-----
    # Your SSL certificate content here
    -----END CERTIFICATE-----
  tls-key: |
    -----BEGIN PRIVATE KEY-----
    # Your SSL private key content here
    -----END PRIVATE KEY-----

---
# TLS Secret for HTTPS
apiVersion: v1
kind: Secret
metadata:
  name: ai-simulation-tls
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: security
type: kubernetes.io/tls
data:
  tls.crt: |
    # Base64 encoded certificate
  tls.key: |
    # Base64 encoded private key

---
# Docker registry secret for pulling private images
apiVersion: v1
kind: Secret
metadata:
  name: ai-simulation-registry-secret
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: security
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "auth": "base64-encoded-auth-token"
        }
      }
    }