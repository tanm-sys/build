# AI Simulation API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-simulation-api
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: api
    version: "{{ .Values.image.tag }}"
spec:
  replicas: "{{ .Values.api.replicas }}"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-simulation
      component: api
  template:
    metadata:
      labels:
        app: ai-simulation
        component: api
        version: "{{ .Values.image.tag }}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-simulation-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: ai-simulation-api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: websocket
          containerPort: 8503
          protocol: TCP
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-simulation-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ai-simulation-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ai-simulation-secrets
              key: jwt-secret
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        - name: LOG_LEVEL
          value: "{{ .Values.logLevel }}"
        - name: MAX_AGENTS
          value: "{{ .Values.maxAgents }}"
        - name: SIMULATION_STEPS
          value: "{{ .Values.simulationSteps }}"
        resources:
          requests:
            cpu: "{{ .Values.api.resources.requests.cpu }}"
            memory: "{{ .Values.api.resources.requests.memory }}"
          limits:
            cpu: "{{ .Values.api.resources.limits.cpu }}"
            memory: "{{ .Values.api.resources.limits.memory }}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: ai-simulation-data
      nodeSelector:
        workload-type: compute
      tolerations:
      - key: "ai-simulation"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - ai-simulation
                - key: component
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname

---
# AI Simulation UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-simulation-ui
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: ui
    version: "{{ .Values.image.tag }}"
spec:
  replicas: "{{ .Values.ui.replicas }}"
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ai-simulation
      component: ui
  template:
    metadata:
      labels:
        app: ai-simulation
        component: ui
        version: "{{ .Values.image.tag }}"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8502"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-simulation-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 2001
      containers:
      - name: ai-simulation-ui
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        ports:
        - name: streamlit
          containerPort: 8501
          protocol: TCP
        - name: api
          containerPort: 8502
          protocol: TCP
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: API_SERVER_PORT
          value: "8502"
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: BACKEND_API_URL
          value: "http://ai-simulation-api:8000"
        - name: ENVIRONMENT
          value: "{{ .Values.environment }}"
        resources:
          requests:
            cpu: "{{ .Values.ui.resources.requests.cpu }}"
            memory: "{{ .Values.ui.resources.requests.memory }}"
          limits:
            cpu: "{{ .Values.ui.resources.limits.cpu }}"
            memory: "{{ .Values.ui.resources.limits.memory }}"
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: app-logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: ai-simulation-ui-data

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-simulation-redis
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-simulation
      component: redis
  template:
    metadata:
      labels:
        app: ai-simulation
        component: redis
    spec:
      serviceAccountName: ai-simulation-redis
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        command:
        - redis-server
        - --appendonly
        - "yes"
        - --appendfsync
        - everysec
        - --save
        - "60 10000"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: ai-simulation-redis-data

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-simulation-postgresql
  namespace: ai-simulation
  labels:
    app: ai-simulation
    component: postgresql
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: ai-simulation
      component: postgresql
  template:
    metadata:
      labels:
        app: ai-simulation
        component: postgresql
    spec:
      serviceAccountName: ai-simulation-postgresql
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "ai_simulation"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: ai-simulation-secrets
              key: postgresql-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-simulation-secrets
              key: postgresql-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi
      storageClassName: "{{ .Values.storage.storageClass }}"